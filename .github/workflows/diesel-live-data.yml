name: Diesel framework live data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_diesel_live.py
      - .github/workflows/diesel-live-data.yml

permissions:
  contents: write

concurrency:
  group: diesel-live-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live indicators
        run: python scripts/fetch_diesel_live.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- diesel-framework/data/live.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "diesel-live-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diesel-framework/data/live.json
          git commit -m "Refresh diesel framework live data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
